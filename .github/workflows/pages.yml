name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 06:23 JST every day.
    - cron: '23 21 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # codopsy (O6lvl4/codopsy): rank A and no warnings on the scripts, or nothing is deployed.
  # Built from main: the v2.2.0 release flags TypeScript `import type` as unused.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-directories: ~/.cargo/bin
      - name: Install codopsy (main)
        run: command -v codopsy || cargo install --git https://github.com/O6lvl4/codopsy.git --locked
      - name: Quality gate (rank A, no warnings)
        run: |
          codopsy analyze ./scripts --fail-on-warning -o codopsy-report.json
          node -e '
            const s = require("./codopsy-report.json").score;
            console.log(`codopsy: ${s.grade} (${s.overall}/100)`);
            if (s.grade !== "A") process.exit(1);
          '

  build:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Refresh public repositories and rebuild all languages
        run: npm run refresh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check rendered pages in Chromium
        run: node test/browser.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # The daily refresh keeps what it published: data/ and site/ in the repository stay the
      # pages that are live, and the commit is the repository activity that keeps GitHub from
      # disabling a schedule after 60 quiet days. A commit made with GITHUB_TOKEN never starts
      # another workflow run, so recording the build cannot trigger a build. A push already
      # carries its own change, a run started on another branch has no business writing to main,
      # and the deployment above is never held up by this record.
      - name: Record the refreshed portfolio on main
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data site
          if git diff --cached --quiet; then
            echo 'The refresh produced no change'
            exit 0
          fi
          changed=$(git diff --cached --name-only | wc -l | tr -d ' ')
          repositories=$(node -p 'require("./site/updated.json").repositories')
          git commit -q \
            -m "Refresh the portfolio from ${repositories} public repositories" \
            -m "${changed} generated files, rebuilt and checked by ${GITHUB_WORKFLOW} run ${GITHUB_RUN_ID}."
          for attempt in 1 2 3; do
            if git push --quiet origin HEAD:main; then
              echo "Recorded ${changed} files on main"
              exit 0
            fi
            echo "main moved while this build ran (attempt ${attempt}); rebasing the record onto it"
            git fetch --quiet origin main
            git rebase -X theirs FETCH_HEAD || git rebase --abort || true
            sleep 5
          done
          echo 'Could not record the refresh on main; the published site is unaffected'
          exit 1
      # Summaries stay handwritten, so the refresh only says which new projects are waiting for
      # one. Like the record above, this never holds up a deployment.
      - name: Say which projects still have no summary
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: node scripts/summaries-issue.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
