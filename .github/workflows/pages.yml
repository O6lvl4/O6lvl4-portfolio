name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 06:23 JST every day.
    - cron: '23 21 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # codopsy (O6lvl4/codopsy): rank A and no warnings on the scripts, or nothing is deployed.
  # Built from main: the v2.2.0 release flags TypeScript `import type` as unused.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-directories: ~/.cargo/bin
      - name: Install codopsy (main)
        run: command -v codopsy || cargo install --git https://github.com/O6lvl4/codopsy.git --locked
      - name: Quality gate (rank A, no warnings)
        run: |
          codopsy analyze ./scripts --fail-on-warning -o codopsy-report.json
          node -e '
            const s = require("./codopsy-report.json").score;
            console.log(`codopsy: ${s.grade} (${s.overall}/100)`);
            if (s.grade !== "A") process.exit(1);
          '

  build:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Refresh public repositories and rebuild all languages
        run: npm run refresh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check rendered pages in Chromium
        run: node test/browser.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
